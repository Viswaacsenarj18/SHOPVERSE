<div class="container py-5">
  <h2 class="mb-4">Your Wishlist / Buy Now</h2>
  <div id="wishlist-items" class="row g-4"></div>
</div>


<script>
// Get wishlist items from localStorage
const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
const container = document.getElementById('wishlist-items');

if (wishlist.length === 0) {
  container.innerHTML = '<p class="text-muted">Your wishlist is empty.</p>';
} else {
  wishlist.forEach((item, index) => {
    container.innerHTML += `
      <div class="col-md-4">
        <div class="card">
          <img src="${item.image}" class="card-img-top" alt="${item.title}">
          <div class="card-body">
            <h5 class="card-title">${item.title}</h5>
            <p class="card-text">${item.brand}</p>
            <p class="card-text text-success fw-bold">$${item.price}</p>
            <button class="btn btn-success proceed-btn" data-id="${item.id}">Proceed to Buy</button>
          </div>
        </div>
      </div>
    `;
  });

  // Wait for DOM to update, then bind click
  setTimeout(() => {
    document.querySelectorAll('.proceed-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const productId = this.getAttribute('data-id');

        // Optional: Remove item from wishlist
        const updatedWishlist = wishlist.filter(item => item.id !== productId);
        localStorage.setItem('wishlist', JSON.stringify(updatedWishlist));

        // Redirect to checkout page
        window.location.href = 'checkout.html';
      });
    });
  }, 100);
}
</script>
